<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>لا يوجد اتصال — ديوان البصرة</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem; background: #f1f5f9; color: #0f172a;
            font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
        }
        .card {
            max-width: 26rem; width: 100%; text-align: center;
            background: #fff; border-radius: 1.25rem; padding: 2.5rem 2rem;
            box-shadow: 0 10px 40px rgb(15 23 42 / .08);
        }
        .icon {
            width: 4rem; height: 4rem; margin: 0 auto 1.25rem;
            display: flex; align-items: center; justify-content: center;
            background: #fef3c7; border-radius: 1rem; font-size: 2rem;
        }
        h1 { margin: 0 0 .5rem; font-size: 1.25rem; font-weight: 800; }
        p { margin: 0 0 1.5rem; font-size: .875rem; line-height: 1.8; color: #475569; }
        button {
            width: 100%; padding: .75rem; border: 0; border-radius: .75rem;
            background: #0f766e; color: #fff; font-size: .875rem; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        button:hover { background: #115e59; }
        .note { margin-top: 1rem; font-size: .75rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>
            النظام يعمل مباشرةً على الخادم لأن الحجوزات والأرصدة والمخزون تتغيّر لحظيًا،
            فعرضها من ذاكرة الجهاز قد يُظهر بيانات قديمة. تحقّق من اتصالك ثم أعد المحاولة.
        </p>
        <button type="button" onclick="location.reload()">إعادة المحاولة</button>
        <p class="note">ديوان البصرة</p>
    </div>
</body>
</html>
